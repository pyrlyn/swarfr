# T43. The one definition of the gate: `ci.yml` runs it on every pull request, and `bump.yml`,
# the workflow that dispatches `release.yml`, runs it once more on the commit a release is cut
# from. A release is the one build nobody can re-run for themselves: a
# broken binary on the releases page is installed before anyone notices, and `swarfr-update`
# hands it to everyone already running an older copy.
#
# It cannot live inside `release.yml`: dist creates the tag and a draft Release in its `plan` job
# and lets `host` proceed when `build-local-artifacts` is `skipped` — which is what a failed dist
# custom job produces — so a gate in there would publish an empty Release rather than stop one.
# Here a red gate means no dispatch, no tag, and nothing on the releases page.
name: verify

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-latest"]'

  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.MACOS_CI_DISABLED == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    needs: macos-runner
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust, just and git-cliff pinned in mise.toml — same toolchain as local.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Skip the slow cache upload on pull requests; restore still works from main keys.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just check

  # The Windows archive is built for real only in release.yml, and the suite runs on Windows
  # only in a local VM (T24, docs/windows.md) — so both Windows backends at least have to
  # type-check here, before a release tries to build the x86_64 archive.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Into the toolchain rust-toolchain.toml pins, not the default one (see the Justfile).
      - run: |
          rustup target add --toolchain "$(rustc --version --verbose | sed -n 's/^release: //p')" \
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - run: just check-cross
